[package]
name = "plx-ghostty-sys"
description = "Raw FFI bindings to libghostty-vt from Ghostty v1.4.0"
version.workspace = true
edition.workspace = true
publish.workspace = true
links = "ghostty-vt"

[dependencies]

[dev-dependencies]
serde_json.workspace = true

# Not `workspace = true`: src/bindings.rs is generated by bindgen and does not
# follow our naming or clippy conventions. The hand-written parts of this
# crate (build.rs, src/lib.rs, tests/) are small and reviewed by hand.
[lints.rust]
unsafe_code = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
non_upper_case_globals = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "allow", priority = -1 }
# The copy and type bans still apply to the hand-written parts.
disallowed_methods = "deny"
disallowed_types = "deny"
